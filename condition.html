<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
    
    const a = ["a1", "a2", "a3"];
    let len=a.length;
    let text="";


    for(let i = 1; i < len; i++){
        text+=a[i]+"<br>";
    }

    document.getElementById("demo").innerHTML=text;
</script>
   
</body>
</html>
